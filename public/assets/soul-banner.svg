<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @font-face {
        font-family: 'Galindo';
        font-style: normal;
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'Gaegu';
        font-style: normal;
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'Koulen';
        font-style: normal;
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>

  <!-- Cream background -->
  <rect width="1200" height="400" fill="#EEECDF"/>

  <!-- ===== HERO HALO (purple circle, thick border, hard shadow) ===== -->
  <!-- Shadow -->
  <circle cx="223" cy="222" r="110" fill="#121B32"/>
  <!-- Circle -->
  <circle cx="210" cy="212" r="110" fill="#836EF9" stroke="#121B32" stroke-width="3"/>

  <!-- ===== CHOG FACE (paper card, thick border, hard shadow) ===== -->
  <!-- Shadow -->
  <rect x="165" y="172" width="140" height="140" rx="20" fill="#121B32"/>
  <!-- Card -->
  <rect x="158" y="165" width="140" height="140" rx="20" fill="#FFFDF4" stroke="#121B32" stroke-width="3"/>

  <!-- Left eye -->
  <circle cx="205" cy="222" r="21" fill="#E0A0B6"/>
  <circle cx="205" cy="222" r="18" fill="#FFFFFF"/>
  <circle cx="205" cy="224" r="13.5" fill="#121B32"/>
  <circle cx="199" cy="218" r="5.5" fill="#FFFFFF"/>
  <circle cx="210" cy="228" r="2.8" fill="#FFFFFF" opacity="0.6"/>

  <!-- Right eye -->
  <circle cx="260" cy="222" r="21" fill="#E0A0B6"/>
  <circle cx="260" cy="222" r="18" fill="#FFFFFF"/>
  <circle cx="260" cy="224" r="13.5" fill="#121B32"/>
  <circle cx="254" cy="218" r="5.5" fill="#FFFFFF"/>
  <circle cx="265" cy="228" r="2.8" fill="#FFFFFF" opacity="0.6"/>

  <!-- Blush -->
  <ellipse cx="189" cy="245" rx="12" ry="7" fill="#F2AABF" opacity="0.5"/>
  <ellipse cx="276" cy="245" rx="12" ry="7" fill="#F2AABF" opacity="0.5"/>

  <!-- Mouth -->
  <ellipse cx="232" cy="256" rx="8" ry="7" fill="#121B32"/>
  <ellipse cx="232" cy="260" rx="5" ry="3.5" fill="#E07898"/>

  <!-- ===== SPEECH BUBBLE ===== -->
  <!-- Shadow -->
  <rect x="295" y="133" width="90" height="40" rx="14" fill="#121B32"/>
  <!-- Bubble -->
  <rect x="291" y="129" width="90" height="40" rx="14" fill="#FFFDF4" stroke="#121B32" stroke-width="3"/>
  <!-- Tail -->
  <polygon points="300,169 290,185 312,169" fill="#FFFDF4" stroke="#121B32" stroke-width="3" stroke-linejoin="round"/>
  <rect x="298" y="163" width="18" height="10" fill="#FFFDF4"/>
  <!-- Bubble text -->
  <text x="336" y="155" font-family="'Gaegu', cursive" font-size="20" font-weight="700" fill="#121B32" text-anchor="middle">gchog!</text>

  <!-- ===== MAIN TITLE ===== -->
  <text x="440" y="200" font-family="'Galindo', sans-serif" font-size="96" fill="#121B32" letter-spacing="3">SOUL</text>

  <!-- ===== TAGLINE ===== -->
  <text x="445" y="248" font-family="'Gaegu', cursive" font-size="30" font-weight="700" fill="#121B32">give your <tspan fill="#836EF9">chog</tspan> a voice</text>

  <!-- ===== STICKER BADGES ===== -->
  <!-- "CWO" sticker (pink, rotated, thick border, hard shadow) -->
  <g transform="translate(880, 100) rotate(8)">
    <rect x="4" y="4" width="66" height="32" rx="8" fill="#121B32"/>
    <rect x="0" y="0" width="66" height="32" rx="8" fill="#D83E7E" stroke="#121B32" stroke-width="3"/>
    <text x="33" y="23" font-family="'Koulen', sans-serif" font-size="15" fill="#FFFDF4" text-anchor="middle" letter-spacing="3">CWO</text>
  </g>

  <!-- "MONAD" sticker (yellow, rotated opposite) -->
  <g transform="translate(970, 240) rotate(-6)">
    <rect x="4" y="4" width="90" height="32" rx="8" fill="#121B32"/>
    <rect x="0" y="0" width="90" height="32" rx="8" fill="#FFE27A" stroke="#121B32" stroke-width="3"/>
    <text x="45" y="23" font-family="'Koulen', sans-serif" font-size="15" fill="#121B32" text-anchor="middle" letter-spacing="3">MONAD</text>
  </g>

  <!-- ===== EYEBROW PILL (yellow pill badge like the site) ===== -->
  <g transform="translate(445, 266)">
    <rect x="3" y="3" width="196" height="28" rx="14" fill="#121B32"/>
    <rect x="0" y="0" width="196" height="28" rx="14" fill="#FFE27A" stroke="#121B32" stroke-width="3"/>
    <text x="98" y="19" font-family="'Koulen', sans-serif" font-size="12" fill="#121B32" text-anchor="middle" letter-spacing="3">MONAD'S MOST ADORED</text>
  </g>

  <!-- ===== SPARKS ===== -->
  <!-- Spark (8-pointed star shape, like spark.svg) -->
  <g transform="translate(850, 180)">
    <polygon points="0,-18 4,-6 16,-12 7,-2 18,0 7,2 16,12 4,6 0,18 -4,6 -16,12 -7,2 -18,0 -7,-2 -16,-12 -4,-6" fill="#836EF9" stroke="#121B32" stroke-width="1.5"/>
  </g>
  <g transform="translate(1100, 140) rotate(22) scale(0.7)">
    <polygon points="0,-18 4,-6 16,-12 7,-2 18,0 7,2 16,12 4,6 0,18 -4,6 -16,12 -7,2 -18,0 -7,-2 -16,-12 -4,-6" fill="#D83E7E" stroke="#121B32" stroke-width="1.5"/>
  </g>
  <g transform="translate(1050, 310) rotate(-15) scale(0.55)">
    <polygon points="0,-18 4,-6 16,-12 7,-2 18,0 7,2 16,12 4,6 0,18 -4,6 -16,12 -7,2 -18,0 -7,-2 -16,-12 -4,-6" fill="#FFE27A" stroke="#121B32" stroke-width="1.5"/>
  </g>

</svg>
