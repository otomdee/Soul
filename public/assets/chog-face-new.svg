<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#F5F3E6"/>
      <stop offset="100%" stop-color="#EEECDF"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>

  <!-- ===== LEFT EYE ===== -->
  <!-- Outer pink ring -->
  <circle cx="195" cy="235" r="62" fill="#E0A0B6"/>
  <!-- White -->
  <circle cx="195" cy="235" r="54" fill="#FFFFFF"/>
  <!-- Iris -->
  <circle cx="195" cy="240" r="40" fill="#1A1A2E"/>
  <!-- Highlight large -->
  <circle cx="179" cy="223" r="16" fill="#FFFFFF"/>
  <!-- Highlight small -->
  <circle cx="208" cy="250" r="8" fill="#FFFFFF" opacity="0.65"/>

  <!-- ===== RIGHT EYE ===== -->
  <!-- Outer pink ring -->
  <circle cx="317" cy="235" r="62" fill="#E0A0B6"/>
  <!-- White -->
  <circle cx="317" cy="235" r="54" fill="#FFFFFF"/>
  <!-- Iris -->
  <circle cx="317" cy="240" r="40" fill="#1A1A2E"/>
  <!-- Highlight large -->
  <circle cx="301" cy="223" r="16" fill="#FFFFFF"/>
  <!-- Highlight small -->
  <circle cx="330" cy="250" r="8" fill="#FFFFFF" opacity="0.65"/>

  <!-- ===== BLUSH ===== -->
  <ellipse cx="138" cy="310" rx="34" ry="20" fill="#F2AABF" opacity="0.45"/>
  <ellipse cx="374" cy="310" rx="34" ry="20" fill="#F2AABF" opacity="0.45"/>

  <!-- ===== MOUTH ===== -->
